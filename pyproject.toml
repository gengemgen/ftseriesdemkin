[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wsts-cycle-study"
version = "0.1.0"
description = "Reproducible ARIMA analysis of monthly WSTS semiconductor billings"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "scipy==1.18.0",
    "statsforecast==2.1.1",
    "statsmodels==0.14.6",
]

[tool.setuptools.packages.find]
where = ["src"]
